# OneTracker Lovelace cards
# Paste any of these into a dashboard (Edit dashboard → Add card → Manual)

# -----------------------------------------------------------------------------
# 1) Compact summary (stock entities card)
# -----------------------------------------------------------------------------
type: entities
title: Packages
show_header_toggle: false
entities:
  - entity: sensor.onetracker_active_packages
    name: In transit
  - entity: sensor.onetracker_delivered_packages
    name: Delivered

# -----------------------------------------------------------------------------
# 2) Glance card
# -----------------------------------------------------------------------------
type: glance
title: Packages
entities:
  - entity: sensor.onetracker_active_packages
    name: Active
  - entity: sensor.onetracker_delivered_packages
    name: Delivered

# -----------------------------------------------------------------------------
# 3) Detailed list of active packages (Markdown + Jinja)
#    Shows description, carrier, status, location, ETA for each package
# -----------------------------------------------------------------------------
type: markdown
title: Active packages
content: |
  {% set pkgs = state_attr('sensor.onetracker_active_packages', 'packages') or [] %}
  {% if pkgs | length == 0 %}
  No active packages 📦
  {% else %}
  {% for p in pkgs %}
  **{{ p.description }}**
  {% if p.retailer %}· {{ p.retailer }}{% endif %}
  {% if p.carrier %}· {{ p.carrier }}{% endif %}

  {% if p.status_text %}{{ p.status_text }}{% else %}{{ p.status }}{% endif %}
  {% if p.location %} · {{ p.location }}{% endif %}
  {% if p.eta %} · ETA {{ p.eta[:10] }}{% endif %}

  {% if not loop.last %}
  ---
  {% endif %}
  {% endfor %}
  {% endif %}

# -----------------------------------------------------------------------------
# 4) Mushroom chips (requires mushroom card from HACS)
# -----------------------------------------------------------------------------
type: custom:mushroom-chips-card
chips:
  - type: entity
    entity: sensor.onetracker_active_packages
    icon: mdi:truck-delivery
    content_info: none
  - type: entity
    entity: sensor.onetracker_delivered_packages
    icon: mdi:package-variant-closed-check
    content_info: none

# -----------------------------------------------------------------------------
# 5) Mushroom template card with package count + list snippet
# -----------------------------------------------------------------------------
type: custom:mushroom-template-card
primary: "{{ states('sensor.onetracker_active_packages') }} active"
secondary: >-
  {% set pkgs = state_attr('sensor.onetracker_active_packages', 'packages') or [] %}
  {% if pkgs | length == 0 %}Nothing in transit
  {% else %}{{ pkgs | map(attribute='description') | list | join(', ') }}{% endif %}
icon: mdi:package-variant-closed
icon_color: "{{ 'orange' if states('sensor.onetracker_active_packages') | int > 0 else 'grey' }}"
tap_action:
  action: more-info
  entity: sensor.onetracker_active_packages
